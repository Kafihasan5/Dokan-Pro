name: Build Android APK & Play Store Bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK, Play Store AAB & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Signing keys come only from repository secrets (Settings → Secrets and variables → Actions):
      #   RELEASE_KEYSTORE_BASE64  base64 of the .jks file   (base64 -i release.jks | pbcopy)
      #   RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
      # Never commit a keystore or its password: this repository is public.
      - name: Restore Signing Key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing; refusing to publish an unsigned or publicly-signed app."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a3e80e4a2e7439f7b6630450182" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Environment Files
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Build Signed APK and Play Store Bundle
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          gradle assembleRelease bundleRelease -PversionCode=${{ github.run_number }} -PversionName="1.0.${{ github.run_number }}" --no-daemon --stacktrace

      - name: Remove Signing Key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Prepare PlayStore Release Folder
        run: |
          mkdir -p playstore_release
          cp app/build/outputs/bundle/release/*.aab playstore_release/app-release.aab
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT_MSG=$(git log -1 --pretty=%s)
          cat <<EOF > playstore_release/release_info.json
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "1.0.${{ github.run_number }}",
            "applicationId": "com.webix.dokanpro",
            "bundleFile": "app-release.aab",
            "format": "Android App Bundle (AAB)",
            "targetSdk": 36,
            "minSdk": 24,
            "buildTime": "$BUILD_TIME",
            "releaseNotes": "$COMMIT_MSG",
            "note": "Ready for Google Play Console upload"
          }
          EOF

      - name: Upload GitHub APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Upload PlayStore AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: playstore-bundle
          path: playstore_release/app-release.aab
          retention-days: 14

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          gh release create "v${{ github.run_number }}" \
            app/build/outputs/apk/release/app-release.apk \
            playstore_release/app-release.aab \
            --title "Release v1.0.${{ github.run_number }}" \
            --notes "Automated release: $COMMIT_MSG (Includes GitHub APK and Play Store AAB Bundle)" \
            --latest || \
          gh release upload "v${{ github.run_number }}" \
            app/build/outputs/apk/release/app-release.apk \
            playstore_release/app-release.aab \
            --clobber

      - name: Update version.json & Commit PlayStore Release
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          cat <<EOF > version.json
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "1.0.${{ github.run_number }}",
            "downloadUrl": "https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}/app-release.apk",
            "playstoreBundleUrl": "https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}/app-release.aab",
            "releaseNotes": "$COMMIT_MSG"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json playstore_release/
          git diff --staged --quiet || (git commit -m "Auto-update version v1.0.${{ github.run_number }} and playstore bundle [skip ci]" && git pull --rebase origin main && git push origin main)
