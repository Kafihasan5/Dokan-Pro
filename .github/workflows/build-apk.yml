name: Build Android APK & Play Store Bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK, Play Store AAB & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Signing keys are no longer committed (this repository is public). They come from secrets:
      #   LEGACY_DEBUG_KEYSTORE_BASE64  – signs the GitHub APK (same key as before, so installed apps update)
      #   PLAY_UPLOAD_KEYSTORE_BASE64, PLAY_UPLOAD_STORE_PASSWORD, PLAY_UPLOAD_KEY_ALIAS, PLAY_UPLOAD_KEY_PASSWORD
      - name: Restore Signing Keys
        env:
          LEGACY_DEBUG_KEYSTORE_BASE64: ${{ secrets.LEGACY_DEBUG_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$LEGACY_DEBUG_KEYSTORE_BASE64" ] || [ -z "$PLAY_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::Signing key secrets are missing; refusing to build with a new or public key."
            exit 1
          fi
          echo "$LEGACY_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          echo "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a3e80e4a2e7439f7b6630450182" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Environment Files
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Build GitHub Version (Debug APK)
        run: |
          gradle assembleDebug -PversionCode=$((${{ github.run_number }} + 12)) -PversionName="1.0.${{ github.run_number }}" --no-daemon --stacktrace

      - name: Build Play Store Version (Release AAB)
        env:
          STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          gradle bundleRelease -PversionCode=$((${{ github.run_number }} + 12)) -PversionName="1.0.${{ github.run_number }}" --no-daemon --stacktrace

      - name: Remove Signing Keys
        if: always()
        run: rm -f debug.keystore "$RUNNER_TEMP/upload.jks"

      - name: Prepare PlayStore Release Folder
        run: |
          mkdir -p playstore_release
          cp app/build/outputs/bundle/release/*.aab playstore_release/app-release.aab
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat <<EOF > playstore_release/release_info.json
          {
            "versionCode": $(( ${{ github.run_number }} + 12 )),
            "versionName": "1.0.${{ github.run_number }}",
            "applicationId": "com.webix.dokanpro",
            "bundleFile": "app-release.aab",
            "format": "Android App Bundle (AAB)",
            "targetSdk": 36,
            "minSdk": 24,
            "buildTime": "$BUILD_TIME",
            "releaseNotes": "• নতুন উন্নতি ও ফিচার আপডেট\n• বাগ ফিক্স ও নিরাপত্তা উন্নয়ন\n• অ্যাপ আরও দ্রুত ও স্থিতিশীল",
            "note": "Ready for Google Play Console upload"
          }
          EOF

      - name: Upload GitHub APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload PlayStore AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: playstore-bundle
          path: playstore_release/app-release.aab
          retention-days: 14

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" \
            app/build/outputs/apk/debug/app-debug.apk \
            playstore_release/app-release.aab \
            --title "Release v1.0.${{ github.run_number }}" \
            --notes "$(printf '• নতুন উন্নতি ও ফিচার আপডেট\n• বাগ ফিক্স ও নিরাপত্তা উন্নয়ন\n• অ্যাপ আরও দ্রুত ও স্থিতিশীল')" \
            --latest || \
          gh release upload "v${{ github.run_number }}" \
            app/build/outputs/apk/debug/app-debug.apk \
            playstore_release/app-release.aab \
            --clobber

      - name: Update version.json & Commit PlayStore Release
        run: |
          cat <<EOF > version.json
          {
            "versionCode": $(( ${{ github.run_number }} + 12 )),
            "versionName": "1.0.${{ github.run_number }}",
            "downloadUrl": "https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}/app-debug.apk",
            "playstoreBundleUrl": "https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}/app-release.aab",
            "releaseNotes": "• নতুন উন্নতি ও ফিচার আপডেট\n• বাগ ফিক্স ও নিরাপত্তা উন্নয়ন\n• অ্যাপ আরও দ্রুত ও স্থিতিশীল"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json playstore_release/
          git diff --staged --quiet || (git commit -m "Auto-update version v1.0.${{ github.run_number }} and playstore bundle [skip ci]" && git pull --rebase origin main && git push origin main)
